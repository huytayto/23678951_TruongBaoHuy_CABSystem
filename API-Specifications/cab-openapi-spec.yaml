openapi: 3.0.3
info:
  title: CAB Platform API
  version: 3.0.0
  description: >
    Public REST API exposed exclusively by the API Gateway. Gateway-to-service
    communication uses gRPC; domain events are delivered asynchronously through Kafka.
    Text values in JSON responses are HTML-escaped to reduce reflected and stored XSS risk.
    Every /api/v1/... route also accepts the short /... path with identical authentication.
    Entity references accept UUIDs or readable codes: C1 customer, D1 driver, B1 booking,
    T1 trip, P1 payment. Use the code returned by the API; existing databases may start
    new records at higher numbers. Codes are stable, unique, case-insensitive aliases.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose deployment
tags:
  - name: Health
  - name: Authentication
  - name: Customers
  - name: Drivers
  - name: Bookings
  - name: Trips
  - name: Payments
  - name: Notifications
paths:
  /:
    get:
      summary: List short URLs and manual usage hints
      responses:
        '200': {description: Public API directory without credentials}
  /health:
    get:
      tags: [Health]
      summary: Gateway liveness check
      responses:
        '200':
          description: Gateway process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: healthy}
  /ready:
    get:
      tags: [Health]
      summary: Readiness check for services and infrastructure
      responses:
        '200':
          description: All dependencies are ready
        '503':
          description: One or more dependencies are unavailable
  /health/services:
    get:
      tags: [Health]
      summary: Health of all microservices and infrastructure dependencies
      responses:
        '200':
          description: All services are healthy
        '503':
          description: At least one service or dependency is degraded
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer or driver account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, maxLength: 100, example: "0901234567"}
                password: {type: string, minLength: 8, maxLength: 128, format: password, example: "Password@123"}
                role: {type: string, enum: [CUSTOMER, DRIVER], default: CUSTOMER}
                fullname: {type: string, maxLength: 200}
      responses:
        '201': {description: Account created; CUSTOMER registrations also create a profile}
        '400': {description: Input validation failed}
        '409': {description: Username already exists}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and issue a signed JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  token: {type: string}
                  uid: {type: string, format: uuid}
                  role: {type: string, enum: [CUSTOMER, DRIVER, ADMIN]}
                  token_type: {type: string, example: Bearer}
                  expires_in: {type: integer, example: 3600}
        '401': {description: Invalid credentials}
        '403': {description: Account is not active}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current access token until it expires
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Token revoked}
        '401': {description: Missing, invalid, expired, or revoked token}
  /api/v1/customers/me:
    get:
      tags: [Customers]
      summary: Get the authenticated customer's profile
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Customer profile}
        '401': {description: Unauthorized}
        '404': {description: Profile not found}
  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      summary: Get a customer profile by ID (self or ADMIN)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Customer profile}
        '403': {description: A customer may only read their own profile}
        '404': {description: Customer not found}
    put:
      tags: [Customers]
      summary: Update a customer profile (ADMIN only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname: {type: string}
                age: {type: integer, minimum: 0, maximum: 120}
                address: {type: string}
      responses:
        '200': {description: Profile updated}
        '403': {description: ADMIN role required}
    delete:
      tags: [Customers]
      summary: Delete a customer profile (ADMIN only)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Profile deleted}
        '403': {description: ADMIN role required}
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customer profiles (ADMIN only)
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Paginated customer profiles}
        '403': {description: ADMIN role required}
    post:
      tags: [Customers]
      summary: Create a customer profile (ADMIN only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uid, fullname]
              properties:
                uid: {type: string, format: uuid}
                fullname: {type: string}
                age: {type: integer, minimum: 0, maximum: 120}
                address: {type: string}
      responses:
        '201': {description: Profile created}
        '403': {description: ADMIN role required}
  /api/v1/drivers/register:
    post:
      tags: [Drivers]
      summary: Submit a driver and vehicle profile for approval (DRIVER only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_number, plate_number]
              properties:
                license_number: {type: string}
                plate_number: {type: string}
                vehicle_type: {type: string, enum: [CAB_4_SEAT], default: CAB_4_SEAT}
      responses:
        '201': {description: Driver profile created in PENDING_APPROVAL state}
        '403': {description: DRIVER role required}
        '409': {description: License, plate, or driver profile already registered}
  /api/v1/admin/drivers/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Drivers]
      summary: Approve or reject a pending driver (ADMIN only)
      security: [{BearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: {type: boolean, default: true}
      responses:
        '200': {description: Driver review saved}
        '403': {description: ADMIN role required}
        '404': {description: Pending driver not found}
  /api/v1/drivers/availability:
    patch:
      tags: [Drivers]
      summary: Set driver online or offline
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: {type: boolean}
                latitude: {type: number, minimum: -90, maximum: 90}
                longitude: {type: number, minimum: -180, maximum: 180}
      responses:
        '200': {description: Availability updated}
        '403': {description: DRIVER role or active approved profile required}
  /api/v1/drivers/nearby:
    get:
      tags: [Drivers]
      summary: Search available approved drivers near a coordinate
      description: Administrative/test endpoint. Customer booking discovery calls Driver Service internally.
      security: [{BearerAuth: []}]
      parameters:
        - name: lat
          in: query
          required: true
          schema: {type: number, minimum: -90, maximum: 90, example: 10.776889}
        - name: lng
          in: query
          required: true
          schema: {type: number, minimum: -180, maximum: 180, example: 106.700806}
        - name: radius
          in: query
          schema: {oneOf: [{type: integer, minimum: 1, maximum: 50000}, {type: string, enum: ["1km"]}], default: 1000}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
      responses:
        '200': {description: Nearby available drivers, ordered by distance}
        '400': {description: Invalid coordinates or pagination}
  /api/v1/drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Drivers]
      summary: Get a driver profile by ID (own profile or ADMIN)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Driver profile}
        '404': {description: Driver not found}
  /api/v1/bookings:
    post:
      tags: [Bookings]
      summary: Create a booking and start sequential nearby-driver dispatch
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_lat, pickup_lng, dropoff_lat, dropoff_lng]
              properties:
                pickup_lat: {type: number, example: 10.776889}
                pickup_lng: {type: number, example: 106.700806}
                dropoff_lat: {type: number, example: 10.7725}
                dropoff_lng: {type: number, example: 106.698}
                vehicle_type: {type: string, enum: [CAB_4_SEAT], default: CAB_4_SEAT}
      responses:
        '201': {description: Booking created; offers are sent sequentially to nearby drivers}
        '400': {description: Invalid booking input}
        '429': {description: Rate limit exceeded}
    get:
      tags: [Bookings]
      summary: List bookings for the authenticated customer
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Paginated customer bookings}
  /api/v1/bookings/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Bookings]
      summary: Accept the current booking offer (DRIVER only)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Trip assigned}
        '403': {description: DRIVER role or assigned offer required}
        '409': {description: Offer expired, already accepted, or another driver won the lock}
  /api/v1/bookings/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Bookings]
      summary: Cancel a booking while searching for a driver
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: Booking canceled}
        '409': {description: Booking cannot be canceled}
  /api/v1/trips/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Trips]
      summary: Advance trip to its next valid state (assigned DRIVER only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [EN_ROUTE, ARRIVED, PICKED_UP, IN_PROGRESS, COMPLETED]
      responses:
        '200': {description: Trip status advanced}
        '400': {description: Invalid state transition}
        '403': {description: Only the assigned driver may update the trip}
  /api/v1/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      summary: Get trip and assigned driver details (trip participants or ADMIN)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Trip and driver profile}
        '403': {description: Caller is not a trip participant}
        '404': {description: Trip not found}
  /api/v1/trips/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Cancel a non-terminal trip with a reason (customer only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: Trip canceled and driver released}
        '400': {description: Cancellation reason required}
        '409': {description: Trip cannot be canceled}
  /api/v1/trips/{id}/rating:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Rate a completed trip once (customer only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string, maxLength: 2000}
      responses:
        '201': {description: Rating saved}
        '400': {description: Invalid rating or trip not completed}
        '409': {description: Trip has already been rated}
  /api/v1/payments/online:
    post:
      tags: [Payments]
      summary: Create an online payment attempt with idempotency protection
      description: >
        Reusing an Idempotency-Key for the same authenticated customer and trip
        returns the exact original response snapshot. The unique database key
        prevents a replay from creating a second payment transaction. The payment
        amount is read from the completed trip, not accepted from the client.
      security: [{BearerAuth: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trip_id]
              properties:
                trip_id: {type: string, description: Trip UUID or readable T code, example: T1}
      responses:
        '200': {description: New payment attempt or exact response saved for the original request}
        '409': {description: Idempotency-Key was already used for a different payment}
        '400': {description: Missing trip or idempotency key}
  /api/v1/payments/cash-confirm:
    post:
      tags: [Payments]
      summary: Confirm cash received for a completed trip (assigned DRIVER only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trip_id]
              properties:
                trip_id: {type: string, description: Trip UUID or readable T code, example: T1}
                amount: {type: number, minimum: 0}
      responses:
        '200': {description: Cash payment completed}
        '403': {description: Only assigned driver can confirm payment}
  /api/v1/payments/webhook:
    post:
      tags: [Payments]
      summary: Process signed payment provider callback
      description: Signature is HMAC-SHA256 of the UTF-8 string order_id:status using PAYMENT_WEBHOOK_SECRET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status, signature]
              properties:
                order_id: {type: string, description: Payment UUID or P code. HMAC covers the literal supplied order_id.}
                status: {type: string, enum: [SUCCESS, FAILED]}
                signature: {type: string, description: Lowercase hexadecimal HMAC-SHA256}
      responses:
        '200': {description: Payment state updated}
        '401': {description: Invalid callback signature}
        '404': {description: Pending payment not found}
  /api/v1/notifications/logs:
    get:
      tags: [Notifications]
      summary: List Kafka events consumed by the notification service (ADMIN only)
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Notification event log}
        '403': {description: ADMIN role required}
  /api/v1/auth/otp/request:
    post:
      tags: [Authentication]
      summary: Request driver phone OTP (authenticated DRIVER)
      description: Local demo transport requires OTP_TEST_MODE=true. Production SMS adapter is not implemented. OTP expires in 300 seconds; resend cooldown 30 seconds.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {type: string, pattern: '^\+?[0-9]{9,15}$'}
      responses:
        '201': {description: Challenge created without exposing code}
        '400': {description: Invalid phone}
        '429': {description: Resend cooldown}
        '503': {description: Local test mode disabled and SMS adapter unavailable}
  /api/v1/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify single-use phone OTP before driver profile submission
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                challenge_id: {type: string, format: uuid, description: Optional. Defaults to the current challenge of the authenticated driver.}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200': {description: Phone verified for ten minutes; consumed on profile registration}
        '400': {description: Wrong, expired, or consumed OTP}
        '403': {description: Challenge belongs to another driver}
        '429': {description: Too many verification attempts}
  /api/v1/admin/test/otp/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Authentication]
      summary: ADMIN-only local OTP test inbox
      description: Only enabled by OTP_TEST_MODE=true. Never enable on a public deployment. Simulates SMS delivery for rubric testing.
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Local demo OTP code}
        '403': {description: ADMIN required}
        '404': {description: Test mode disabled or challenge expired}
  /api/v1/admin/drivers:
    get:
      tags: [Drivers]
      summary: List pending driver profiles (ADMIN only)
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: Pending profiles and pagination}
        '403': {description: ADMIN required}
  /api/v1/drivers/offers:
    get:
      tags: [Bookings]
      summary: List unexpired booking offers addressed to authenticated driver
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Offers with pickup and dropoff coordinates}
        '403': {description: DRIVER required}
  /api/v1/bookings/{id}/trip:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      summary: Resolve booking to trip and assigned driver (participants or ADMIN only)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Trip, payment_status, payment_id, location, and assigned driver}
        '403': {description: Not a trip participant}
        '404': {description: No trip assigned yet}
  /api/v1/trips/{id}/location:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Trips]
      summary: Update live trip coordinates (assigned DRIVER only)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: {type: number, minimum: -90, maximum: 90}
                longitude: {type: number, minimum: -180, maximum: 180}
      responses:
        '200': {description: Location persisted and event published}
        '400': {description: Invalid coordinates}
        '409': {description: Trip inactive or driver not assigned}
  /api/v1/notifications/me:
    get:
      tags: [Notifications]
      summary: Poll notification inbox for authenticated user
      description: Durable inbox populated asynchronously from Kafka. No push/SMS transport.
      security: [{BearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200': {description: Notifications where customer_id or driver_id matches token subject}
        '401': {description: Authentication required}
  /api/v1/auth/otp:
    get:
      tags: [Authentication]
      summary: Read own simulated SMS inbox (DRIVER, local OTP_TEST_MODE only)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Own current challenge ID and code}
        '403': {description: DRIVER role required}
        '404': {description: Local OTP disabled or challenge missing}
  /api/v1/drivers/me:
    get:
      tags: [Drivers]
      summary: Get own profile and readable driver code
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Driver profile}
        '404': {description: Profile not yet submitted}
  /api/v1/bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Bookings]
      summary: Get booking by B code or UUID (owner, offered or assigned driver, ADMIN)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Booking with readable code}
        '403': {description: Not a participant}
        '404': {description: Booking not found}
  /api/v1/payments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Payments]
      summary: Read payment by P code or UUID (trip participants or ADMIN)
      security: [{BearerAuth: []}]
      responses:
        '200': {description: Payment status without internal response snapshot}
        '403': {description: Not a participant}
        '404': {description: Payment not found}
  /api/v1/demo/payments/{id}/callback:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Payments]
      summary: ADMIN-only local payment provider simulator
      description: Requires PAYMENT_TEST_MODE=true. Computes HMAC internally and calls the same webhook handler; does not expose the secret. No real money is transferred.
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [SUCCESS, FAILED]}
      responses:
        '200': {description: Signed callback processed}
        '400': {description: Invalid status}
        '403': {description: ADMIN role required}
        '404': {description: Simulator disabled or payment missing}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: UUID or readable entity code (C1, D1, B1, T1, P1), as appropriate for the route
      schema: {type: string}
