openapi: 3.0.3
info:
  title: CAB Ride & Trip Execution Service API
  version: 3.0.0
  description: Two status updates (IN_PROGRESS then COMPLETED), Fixed Fare Calculation, and 5-Star Rating.
paths:
  /api/v1/trips/{id}/status:
    patch:
      summary: Update trip status (DRIVER_ASSIGNED -> IN_PROGRESS -> COMPLETED)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - IN_PROGRESS
                    - COMPLETED
                    - start
                    - done
      responses:
        "200":
          description: Status updated successfully
        "400":
          description: Invalid status transition jump
  /api/v1/trips/{id}/rating:
    post:
      summary: Customer rate completed trip
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Friendly driver, smooth ride
      responses:
        "201":
          description: Rating submitted successfully
        "400":
          description: Trip already rated or invalid
